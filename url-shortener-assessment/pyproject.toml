[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewable-url-shortener"
version = "1.0.0"
description = "Engineer-led URL shortener assessment and governed evidence workbench"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.2", "pydantic==2.13.5", "uvicorn==0.48.0", "idna==3.17"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
shortener = ["migrations/*.sql", "static/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["integration: SQLite and API integration", "concurrency: multithreaded tests", "workflow: governed workflow execution"]

[tool.coverage.run]
branch = true
source = ["shortener"]
omit = ["*/__main__.py"]
[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S603", "S607"]
"src/shortener/worker.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
files = ["src/shortener"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
